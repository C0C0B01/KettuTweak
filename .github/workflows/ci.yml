name: Build Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-check:
    name: Build Check
    uses: ./.github/workflows/deploy.yml
    with:
      ipa_url: ""
      is_testflight: false
      release: false
      caller_workflow: "ci"
    secrets: inherit 